<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>球星卡日报</title>
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --line:#e6e9f0; --shadow:0 1px 3px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.05);
    --radius:16px; --total:#b45309;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px 64px}
  .hero{background:linear-gradient(135deg,#b45309 0%,#dc2626 55%,#7c2d12 100%);color:#fff;border-radius:0 0 28px 28px;padding:44px 20px 36px;box-shadow:var(--shadow)}
  .hero-inner{max-width:1120px;margin:0 auto;padding:0 20px}
  .kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.85;font-weight:600}
  .hero h1{font-size:34px;font-weight:800;margin:6px 0 2px;letter-spacing:.5px}
  .hero .date{font-size:20px;font-weight:600;opacity:.95}
  .hero .gen{font-size:13px;opacity:.82;margin-top:6px}
  .stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
  .stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px 16px;min-width:96px;backdrop-filter:blur(4px)}
  .stat .n{font-size:24px;font-weight:800;line-height:1}
  .stat .l{font-size:12.5px;opacity:.92;margin-top:5px}
  .stat.total{background:rgba(255,255,255,.95);color:var(--total)}
  .stat.total .l{color:#6b7280}
  .controls{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 0}
  .controls-inner{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .ctl-label{font-weight:700;font-size:14px;color:var(--ink)}
  .controls label{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .controls input[type=date]{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fff}
  .controls .sep{color:var(--muted);font-weight:700}
  #refreshBtn{cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:#fff;border:none;border-radius:10px;padding:9px 18px;background:var(--total);box-shadow:var(--shadow);transition:.15s}
  #refreshBtn:hover{transform:translateY(-1px);filter:brightness(1.05)}
  #exportPdfBtn,#exportImgBtn{cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);border-radius:10px;padding:9px 16px;background:#fff;box-shadow:var(--shadow);transition:.15s}
  #exportPdfBtn{color:#b91c1c}
  #exportImgBtn{color:#0f766e}
  #exportPdfBtn:hover,#exportImgBtn:hover{transform:translateY(-1px);background:#f9fafb}
  .status{font-size:13px;color:var(--muted);margin-left:4px}
  .nav{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:26px}
  .nav-inner{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;flex-wrap:wrap;gap:10px}
  .nav a{text-decoration:none;color:var(--ink);font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 15px;display:flex;align-items:center;gap:7px;transition:.15s}
  .nav a:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .nav a .dot{width:9px;height:9px;border-radius:50%}
  .nav a .c{font-size:12px;color:var(--muted);font-weight:700}
  .section{margin-bottom:38px;scroll-margin-top:70px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .sec-bar{width:5px;height:26px;border-radius:4px}
  .sec-head h2{font-size:21px;font-weight:800}
  .sec-head .cnt{font-size:13px;color:var(--muted);font-weight:600;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.18s;position:relative;overflow:hidden}
  .card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,#4f46e5)}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(16,24,40,.10)}
  .card-top{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .num{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--accent,#4f46e5);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
  .chip{font-size:12px;font-weight:600;color:var(--accent,#4f46e5);background:color-mix(in srgb,var(--accent,#4f46e5) 12%,#fff);border:1px solid color-mix(in srgb,var(--accent,#4f46e5) 28%,#fff);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .card h3{font-size:16px;font-weight:700;line-height:1.5;margin-bottom:7px}
  .card h3 a{color:var(--ink);text-decoration:none}
  .card h3 a:hover{color:var(--accent,#4f46e5);text-decoration:underline}
  .orig{font-size:12px;color:var(--muted);margin:-2px 0 9px;font-style:italic}
  .sum{font-size:13.5px;color:#3a4252;flex:1;margin-bottom:13px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px}
  .badge{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px;border:1px solid;display:inline-flex;align-items:center;gap:4px;line-height:1.25;white-space:nowrap}
  .badge.deadline.urgent{color:#fff;background:#dc2626;border-color:#dc2626;box-shadow:0 0 0 2px rgba(220,38,38,.18),0 2px 8px rgba(220,38,38,.25);animation:pulseUrgent 1.8s ease-in-out infinite}
  @keyframes pulseUrgent{0%,100%{box-shadow:0 0 0 2px rgba(220,38,38,.18),0 2px 8px rgba(220,38,38,.25)}50%{box-shadow:0 0 0 5px rgba(220,38,38,.10),0 2px 12px rgba(220,38,38,.40)}}
  .badge.deadline.soon{color:#92400e;background:#fef3c7;border-color:#fcd34d}
  .badge.deadline.normal{color:#374151;background:#f3f4f6;border-color:#e5e7eb}
  .badge.deadline.overdue{color:#fff;background:#6b7280;border-color:#6b7280;text-decoration:line-through}
  .badge.release{color:#1e40af;background:#dbeafe;border-color:#93c5fd}
  .badge.status{color:#065f46;background:#d1fae5;border-color:#6ee7b7}
  .players{background:color-mix(in srgb,var(--accent,#4f46e5) 7%,#fff);border:1px solid color-mix(in srgb,var(--accent,#4f46e5) 18%,#fff);border-radius:10px;padding:9px 11px;margin-bottom:13px}
  .pl-h{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--accent,#4f46e5);margin-bottom:6px}
  .pl{font-size:12.5px;color:#3a4252;line-height:1.5;margin-bottom:5px}
  .pl:last-child{margin-bottom:0}
  .pl-n{font-weight:800;color:var(--ink)}
  .pl-m{color:var(--muted);margin:0 6px}
  .pl-x{display:block;color:#3a4252;margin-top:1px}
  .read{align-self:flex-start;font-size:13px;font-weight:700;color:var(--accent,#4f46e5);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .read:hover{text-decoration:underline}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);font-size:14px}
  footer{margin-top:30px;border-top:1px solid var(--line);padding-top:22px;text-align:center;color:var(--muted);font-size:13px}
  footer a{color:var(--total);text-decoration:none}
  footer .big{font-weight:800;color:var(--ink);font-size:15px}
  #toast{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2000;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding-top:80px}
  .toast-box{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(16,24,40,.28);padding:26px 28px;max-width:420px;text-align:center;margin:0 20px}
  .toast-box p{font-size:16px;font-weight:700;color:var(--ink);margin:0 0 18px;line-height:1.55}
  #toastBtn{font-family:inherit;font-size:14px;font-weight:700;color:#fff;border:none;border-radius:10px;padding:10px 22px;background:var(--total,#4f46e5);cursor:pointer}
  #toastBtn:hover{filter:brightness(1.05)}
  @media(max-width:560px){.hero h1{font-size:27px}.stats{gap:9px}.stat{min-width:80px;padding:10px 12px}.controls-inner{gap:8px}.grid{grid-template-columns:1fr}}
  @media print{
    .controls,.nav,footer{display:none !important}
    #refreshBtn,#exportPdfBtn,#exportImgBtn{display:none !important}
    .badges .deadline.urgent{animation:none !important;box-shadow:none !important}
    body{background:#fff}
    .wrap{padding:0 12px 24px;max-width:none}
    .hero{background:#b45309 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;border-radius:0;padding:24px 16px 18px}
    .hero h1{font-size:24px}
    .card{break-inside:avoid;page-break-inside:avoid;box-shadow:none;border:1px solid #d1d5db}
    .section{break-inside:auto}
    .sec-head{break-after:avoid;page-break-after:avoid}
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .players{break-inside:avoid}
    a{color:#1f2430 !important;text-decoration:none}
  }
</style>
</head>
<body>
  <header class="hero"><div class="hero-inner">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="date" id="dateLine"></div>
    <div class="gen" id="genLine"></div>
    <div class="stats" id="stats"></div>
  </div></header>

  <div class="controls"><div class="controls-inner">

    <button id="refreshBtn" type="button">↻ 刷新</button>

    <button id="exportImgBtn" type="button" title="将当前日报导出为 PNG 图片">🖼️ 导出图片</button>
    <span class="status" id="status"></span>
  </div></div>

  <nav class="nav"><div class="nav-inner" id="nav"></div></nav>
  <main class="wrap" id="main"></main>

  <footer>
    <div class="big" id="footCount"></div>
    <div id="footSrc" style="margin-top:6px"></div>
    <div id="footNote" style="margin-top:4px"></div>
  </footer>

<script>

  function fmtDateCN(ds){if(!ds)return '';const dt=new Date(ds+'T00:00:00Z');const wk=['周日','周一','周二','周三','周四','周五','周六'][dt.getUTCDay()];const p=n=>ds.split('-')[n];return (+p(0))+' 年 '+(+p(1))+' 月 '+(+p(2))+' 日 · '+wk;}
  function trunc(s,n){s=s||'';const a=Array.from(s);return a.length<=n?s:a.slice(0,n).join('')+'…';}
  function prevDay(s){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10);}

      const d=new Date(dates.deadline+'T00:00:00Z');
      const diff=Math.round((d-today)/86400000);
      let cls,label;
      if(diff<0){cls='overdue';label='已截止 '+fmtDateShort(dates.deadline);}
      else if(diff===0){cls='urgent';label='⏰ 今天截止！';}
      else if(diff===1){cls='urgent';label='⏰ 明天截止';}
      else if(diff<=3){cls='soon';label='⏰ 还剩 '+diff+' 天截止';}
      else if(diff<=7){cls='soon';label='⏰ '+diff+' 天后截止';}
      else{cls='normal';label='⏰ 截止 '+fmtDateShort(dates.deadline);}
      out.push('<span class="badge deadline '+cls+'">'+esc(label)+'</span>');
    }
    if(dates.release){
      const d=new Date(dates.release+'T00:00:00Z');
      const diff=Math.round((d-today)/86400000);
      const cls='release';

      sec.appendChild(h);

          it.players.map(p=>'<div class="pl"><span class="pl-n">'+esc(p.name)+'</span>' +
            (p.team?'<span class="pl-m">'+esc(p.team)+'</span>':'') +
            (p.pos?'<span class="pl-m">'+esc(p.pos)+'</span>':'') +

            '</div>').join('') + '</div>'

          '<h3><a href="'+esc(it.url||'#')+'" target="_blank" rel="noopener noreferrer">'+esc(it.title||'')+'</a></h3>'+

      const sec=document.createElement('section'); sec.className='section'; sec.id='flashes';
      const h=document.createElement('div'); h.className='sec-head';
      h.innerHTML='<div class="sec-bar" style="background:#ef4444"></div><h2>快讯</h2><span class="cnt">'+data.flashes.length+' 条</span>';
      sec.appendChild(h);
      const grid=document.createElement('div'); grid.className='flash-grid';
      data.flashes.forEach(fl=>{
        const el=document.createElement('div'); el.className='flash';
        el.innerHTML='<div class="ft"><a href="'+esc(fl.url||'#')+'" target="_blank" rel="noopener noreferrer">'+esc(fl.title||'')+'</a></div><div>'+esc(fl.source||'')+'</div>';
        grid.appendChild(el);
      });
      sec.appendChild(grid); main.appendChild(sec);
    }
    $('footCount').textContent='本期共 '+totalOf(data)+' 条动态';
    $('footSrc').innerHTML='数据源：<strong>'+esc(data.source||'')+'</strong>';
    $('footNote').textContent=data.note||'';
  }
  function status(msg){const el=$('status'); if(el) el.textContent=msg;}
  function showData(data,loadedDate,requestedEnd){
    render(data);
    let msg='已加载 '+loadedDate+' 的日报（共 '+totalOf(data)+' 条）';
    if(requestedEnd && requestedEnd!==loadedDate) msg+=' · 结束日期 '+requestedEnd+' 暂无数据，已回退至 '+loadedDate;
    status(msg);
  }
  function showEmpty(dateStr){
    $('main').innerHTML='<div class="empty" style="grid-column:1/-1">所选日期（'+dateStr+'）暂无可用日报数据。球星卡日报为联网检索快照，需生成对应日期的快照文件（data/card-'+dateStr+'.json）后方可加载。</div>';
    $('stats').innerHTML=''; $('nav').innerHTML='';
    $('title').textContent=(embedded&&embedded.title)||'日报';
    $('kicker').textContent=(embedded&&embedded.kicker)||'';
    $('dateLine').textContent=fmtDateCN(dateStr); $('genLine').textContent='';
    $('footCount').textContent=''; $('footSrc').textContent=''; $('footNote').textContent='';
    status('未找到 '+dateStr+' 的日报');
  }
  function showToast(msg,onConfirm){
    const old=$('toast'); if(old) old.remove();
    const box=document.createElement('div'); box.id='toast';
    box.innerHTML='<div class="toast-box"><p>'+esc(msg)+'</p><button id="toastBtn" type="button">查看前一日</button></div>';
    document.body.appendChild(box);
    $('toastBtn').addEventListener('click',()=>{ box.remove(); if(onConfirm) onConfirm(); });
  }
  async function fallbackAndShow(requestedEnd){
    let data=null,date=null;
    for(let d=prevDay(requestedEnd); d>=defaultDate; d=prevDay(d)){
      const dd=await CFG.fetchDaily(d);
      if(dd){ data=dd; date=d; break; }
      if(d===defaultDate) break;
    }
    if(!data && embedded){ data=embedded; date=defaultDate; }
    if(data) showData(data,date,requestedEnd);
    else showEmpty(requestedEnd);
  }
  function wire(){
    const startInp=$('startDate'), endInp=$('endDate'), btn=$('refreshBtn');
    if(!startInp||!endInp||!btn) return;
    const now=new Date();
    const realToday=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
    startInp.max=endInp.max=realToday;
    const initial=(realToday>=defaultDate)?realToday:defaultDate;
    startInp.value=endInp.value=initial;
    const doRefresh=async ()=>{
      let s=startInp.value, e=endInp.value;
      if(!s||!e){ status('请选择起始日期和结束日期'); return; }
      if(e<s){ const tmp=s; s=e; e=tmp; startInp.value=s; endInp.value=e; }
      status('正在加载…');
      let found=false, data=null, date=null;
      for(let d=e; d>=s; d=prevDay(d)){
        const dd = await CFG.fetchDaily(d);
        if(dd){ found=true; data=dd; date=d; break; }
        if(d===s) break;
      }
      if(found) showData(data, date, e);
      else showToast('未找到 '+e+' 的日报数据', ()=> fallbackAndShow(e));
    };
    btn.addEventListener('click', doRefresh);
    startInp.addEventListener('change', doRefresh);
    endInp.addEventListener('change', doRefresh);
  }
  function exportPDF(){
    if(!lastData){ alert('内容尚未加载'); return; }
    status('正在打开打印对话框…');
    setTimeout(()=>{ try{ window.print(); }catch(e){ status('打印失败：'+e.message); } }, 50);
  }
  async function exportImage(){
    const hero=document.querySelector('.hero');
    const main=document.getElementById('main');
    const footer=document.querySelector('footer');
    if(!hero||!main){ alert('内容尚未加载'); return; }
    const prev=document.getElementById('status')?document.getElementById('status').textContent:'';
    status('正在生成图片…');
    try{
      const styleText=(document.querySelector('style')||{}).textContent||'';
      const w=Math.max(hero.scrollWidth, main.scrollWidth, 900);
      const clean=n=>{const c=n.cloneNode(true);c.querySelectorAll('*').forEach(el=>{if(el.style)el.style.animation='none';});return c;};
      const inner=clean(hero).outerHTML+clean(main).outerHTML+(footer?clean(footer).outerHTML:'');
      const measureHTML='<div style="background:#fff;width:'+w+'px"><style>'+styleText+'</style><div style="padding:0">'+inner+'</div></div>';
      const measure=document.createElement('div');
      measure.style.cssText='position:fixed;left:-99999px;top:0;background:#fff;';
      measure.innerHTML=measureHTML;
      document.body.appendChild(measure);
      const h=measure.scrollHeight;
      document.body.removeChild(measure);
      const xhtml='<div xmlns="http://www.w3.org/1999/xhtml" style="background:#fff;width:'+w+'px"><style>'+styleText+'</style><div style="padding:0">'+inner+'</div></div>';
      const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><foreignObject x="0" y="0" width="'+w+'" height="'+h+'">'+xhtml+'</foreignObject></svg>';
      const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const img=new Image();
      await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('SVG 渲染失败（浏览器可能阻止了 foreignObject）'));img.src=url;});
      const scale=2;
      const canvas=document.createElement('canvas');
      canvas.width=w*scale; canvas.height=h*scale;
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#ffffff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,w,h);
      await new Promise((resolve)=>{
        canvas.toBlob((b)=>{
          const a=document.createElement('a');
          a.href=URL.createObjectURL(b);
          const dt=document.body.dataset.date||'export';
          const ttl=(document.body.dataset.title||'日报').replace(/[\\\/:*?"<>|]/g,'_');
          a.download=ttl+'-'+dt+'.png';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(()=>URL.revokeObjectURL(a.href),1500);
          resolve();
        },'image/png');
      });
      URL.revokeObjectURL(url);
      status('图片已导出：'+ttl+'-'+dt+'.png');
    }catch(e){
      status('图片导出失败：'+e.message);
      alert('图片导出失败：'+e.message+'\n\n可改用浏览器"打印 → 另存为 PDF"。');
    }
  }
  function init(){
    wire();
    const now=new Date();
    const realToday=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
    // 先显示内嵌的最近一期作为兜底
    if(embedded) showData(embedded, defaultDate, defaultDate);
    // 自动刷新到今日：优先加载今日快照，没有则弹出提示并回退到前一日/最近一期
    if(realToday!==defaultDate && CFG.fetchDaily){
      status('正在检查 '+realToday+' 的日报…');
      CFG.fetchDaily(realToday).then(live=>{
        if(live) showData(live, realToday, realToday);
        else showToast('今日（'+realToday+'）暂无日报数据', ()=> fallbackAndShow(realToday));
      }).catch(()=>{ status('今日数据加载失败'); showToast('今日数据加载失败', ()=> fallbackAndShow(realToday)); });
    }
    const pBtn=$('exportPdfBtn'); if(pBtn) pBtn.addEventListener('click', exportPDF);
    const iBtn=$('exportImgBtn'); if(iBtn) iBtn.addEventListener('click', exportImage);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
