<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电力交易日报</title>
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --line:#e6e9f0; --shadow:0 1px 3px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.05);
    --radius:16px; --total:#0f766e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px 64px}
  .hero{background:linear-gradient(135deg,#0f766e 0%,#0ea5e9 55%,#2563eb 100%);color:#fff;border-radius:0 0 28px 28px;padding:44px 20px 36px;margin-bottom:0;box-shadow:var(--shadow)}
  .hero-inner{max-width:1120px;margin:0 auto;padding:0 20px}
  .kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.85;font-weight:600}
  .hero h1{font-size:34px;font-weight:800;margin:6px 0 2px;letter-spacing:.5px}
  .hero .date{font-size:20px;font-weight:600;opacity:.95}
  .hero .gen{font-size:13px;opacity:.82;margin-top:6px}
  .stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
  .stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px 16px;min-width:96px;backdrop-filter:blur(4px)}
  .stat .n{font-size:24px;font-weight:800;line-height:1}
  .stat .l{font-size:12.5px;opacity:.92;margin-top:5px}
  .stat.total{background:rgba(255,255,255,.95);color:var(--total)}
  .stat.total .l{color:#6b7280}
  .controls{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 0}
  .controls-inner{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .ctl-label{font-weight:700;font-size:14px;color:var(--ink)}
  .controls label{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .controls input[type=date]{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fff}
  .controls .sep{color:var(--muted);font-weight:700}
  #refreshBtn{cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:#fff;border:none;border-radius:10px;padding:9px 18px;background:var(--total);box-shadow:var(--shadow);transition:.15s}
  #refreshBtn:hover{transform:translateY(-1px);filter:brightness(1.05)}
  .status{font-size:13px;color:var(--muted);margin-left:4px}
  .nav{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:26px}
  .nav-inner{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;flex-wrap:wrap;gap:10px}
  .nav a{text-decoration:none;color:var(--ink);font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 15px;display:flex;align-items:center;gap:7px;transition:.15s}
  .nav a:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .nav a .dot{width:9px;height:9px;border-radius:50%}
  .nav a .c{font-size:12px;color:var(--muted);font-weight:700}
  .section{margin-bottom:38px;scroll-margin-top:70px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .sec-bar{width:5px;height:26px;border-radius:4px}
  .sec-head h2{font-size:21px;font-weight:800}
  .sec-head .cnt{font-size:13px;color:var(--muted);font-weight:600;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.18s;position:relative;overflow:hidden}
  .card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,#4f46e5)}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(16,24,40,.10)}
  .card-top{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .num{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--accent,#4f46e5);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
  .chip{font-size:12px;font-weight:600;color:var(--accent,#4f46e5);background:color-mix(in srgb,var(--accent,#4f46e5) 12%,#fff);border:1px solid color-mix(in srgb,var(--accent,#4f46e5) 28%,#fff);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .card h3{font-size:16px;font-weight:700;line-height:1.5;margin-bottom:9px}
  .card h3 a{color:var(--ink);text-decoration:none}
  .card h3 a:hover{color:var(--accent,#4f46e5);text-decoration:underline}
  .sum{font-size:13.5px;color:#3a4252;flex:1;margin-bottom:14px}
  .read{align-self:flex-start;font-size:13px;font-weight:700;color:var(--accent,#4f46e5);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .read:hover{text-decoration:underline}
  .flash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
  .flash{background:var(--panel);border:1px solid var(--line);border-left:4px solid #ef4444;border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);font-size:13.5px}
  .flash .ft{font-weight:700;margin-bottom:6px}
  .flash .ft a{color:var(--ink);text-decoration:none}
  .flash .ft a:hover{color:#ef4444;text-decoration:underline}
  .flash .fm{color:var(--muted);font-size:12px;margin-top:5px}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);font-size:14px}
  footer{margin-top:30px;border-top:1px solid var(--line);padding-top:22px;text-align:center;color:var(--muted);font-size:13px}
  footer a{color:var(--total);text-decoration:none}
  footer .big{font-weight:800;color:var(--ink);font-size:15px}
  @media(max-width:560px){.hero h1{font-size:27px}.stats{gap:9px}.stat{min-width:80px;padding:10px 12px}.controls-inner{gap:8px}}
</style>
</head>
<body>
  <header class="hero"><div class="hero-inner">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="date" id="dateLine"></div>
    <div class="gen" id="genLine"></div>
    <div class="stats" id="stats"></div>
  </div></header>

  <div class="controls"><div class="controls-inner">
    <span class="ctl-label">日期范围</span>
    <label>起始 <input type="date" id="startDate"></label>
    <span class="sep">→</span>
    <label>结束 <input type="date" id="endDate"></label>
    <button id="refreshBtn" type="button">↻ 刷新</button>
    <span class="status" id="status"></span>
  </div></div>

  <nav class="nav"><div class="nav-inner" id="nav"></div></nav>
  <main class="wrap" id="main"></main>

  <footer>
    <div class="big" id="footCount"></div>
    <div id="footSrc" style="margin-top:6px"></div>
    <div id="footNote" style="margin-top:4px"></div>
  </footer>

<script>const EMB={"date": "2026-07-27", "source": "联网搜索聚合", "note": "检索日期 2026-07-27，按主题自适应分组；原文链接指向各媒体出处。电力交易日报为联网搜索聚合快照，无实时 API，其他日期需生成对应快照文件（data/power-YYYY-MM-DD.json）后方可加载。", "title": "电力交易日报", "kicker": "电力交易 · 每日早报（联网搜索聚合）", "sections": [{"label": "政策与监管", "color": "#6366f1", "items": [{"title": "关于有序推动多用户绿电直连发展有关事项的通知（发改能源〔2026〕688号）", "source": "国家能源局", "url": "https://www.nea.gov.cn/20260520/9e1c4277ce324c8ab82a84da98da7980/c.html", "summary": "发改、能源局规范多用户绿电直连，并网项目初期\"报量不报价\"参与现货，年上网电量限20%。"}, {"title": "《山东电力市场规则(试行)》(2026年4月修订版)政策解读", "source": "山东能源监管办", "url": "https://sdb.nea.gov.cn/xxgk/zcjd/202605/t20260508_300825.html", "summary": "山东修订电力市场规则，优化现货框架、规范虚拟电厂参与与偏差费用分摊等重点内容。"}, {"title": "《宁夏回族自治区电力中长期市场实施细则》政策解读", "source": "国家能源局西北监管局", "url": "https://xbj.nea.gov.cn/xxgk/zcjd/202603/t20260320_298289.html", "summary": "宁夏中长期细则3月执行，绿电环境价值分离，明确分布式光伏、储能、虚拟电厂等新型主体准入。"}, {"title": "两部门部署在云霄直流开展输电权市场化交易", "source": "国家发展改革委/能源局", "url": "https://www.nea.gov.cn/20260612/6d9c29711f3a4718b121b467cd0f0215/c.html", "summary": "自6月1日起按暂行方案以月度及以内交易起步开展输电权市场化交易，挖掘通道潜力、支撑网间互济。"}]}, {"label": "现货市场与价格", "color": "#f59e0b", "items": [{"title": "国网今年首购南网区域电力现货，应对负荷高峰", "source": "金羊网", "url": "https://www.toutiao.com/article/7663435483380335138", "summary": "7/16国网首购南网跨区现货，全天2791万千瓦时，晚峰最高电价412.8元/兆瓦时、均值351.8元。"}, {"title": "四川40℃高温天为何还会出现负电价", "source": "雪球", "url": "https://xueqiu.com/9079826787/401763887", "summary": "负电价源于用电曲线与出清曲线背离、峰谷差拉大及电源报价分化，系高比例绿电的新常态。"}, {"title": "电力板块遭遇黑色星期一：长协电价下行压力凸显", "source": "腾讯财经", "url": "https://gu.qq.com/resources/shy/news/detail-v2/index.html?t=1#/index?_tentrees_trans=0&id=SN20251230010707a6ddd94b", "summary": "广东年度交易均价372厘/千瓦时同比降约5%，江苏1月集中竞价下浮17%，长协电价下行压制火电估值。"}]}, {"label": "绿电与绿证", "color": "#10b981", "items": [{"title": "国家能源局发布2026年6月全国绿证核发及交易数据", "source": "国家能源局", "url": "https://www.nea.gov.cn/20260724/d35b8a39fb724572b3d3ce3cbed9d4e9/c.html", "summary": "6月核发绿证3.73亿个，交易8273万个，其中绿电交易绿证4289万个；2026年电量绿证均价5.96元/个。"}, {"title": "上半年国家电网市场化交易电量完成3.48万亿千瓦时", "source": "新华社", "url": "https://www.toutiao.com/article/7666078350741471763/", "summary": "上半年国网经营区市场化交易电量同比增25.6%，省间绿电交易641亿千瓦时增23%，交易绿证7411万个。"}, {"title": "重庆绿电交易进入小时级精准时代", "source": "中国电力新闻网", "url": "https://k.sina.com.cn/article_5952915720_162d2490806704iuoq.html", "summary": "重庆印发小时级绿电交易指南，发电/售电/用户分24时段计量，电能量与环境价值分开结算。"}, {"title": "2026年上半年电力市场\"微创新\"盘点", "source": "同花顺", "url": "https://m.10jqka.com.cn/20260723/c678388500.shtml", "summary": "东北/西北/华中区域互济市场加速成形，数据中心以虚拟电厂形式入市，电碳算协同撮合在贵州试点。"}]}, {"label": "虚拟电厂与技术", "color": "#0ea5e9", "items": [{"title": "虚拟电厂下半场：AI电力交易决定谁赚钱", "source": "国能日新/新浪", "url": "https://k.sina.cn/article_5953190046_162d6789e06703i176.html", "summary": "2026年15省出台实施细则，国能日新以\"预测-交易-运营\"三维AI体系与5类Agent实现日前报价自动生成。"}, {"title": "WE平台以AI调度激活虚拟电厂核心价值", "source": "中国发展网", "url": "http://pp.chinadevelopment.com.cn/hyzx2026/0420/1992234.shtml", "summary": "固德威WE平台以\"云-边-端\"架构聚合分布式资源，AI结合价格信号自动生成最优报价，可调超10兆瓦。"}, {"title": "《山东省促进虚拟电厂高质量发展方案》印发", "source": "山东省能源局", "url": "http://nyj.shandong.gov.cn/art/2026/3/27/art_59960_10311577.html", "summary": "山东方案：2027年调节能力达200万千瓦、2030年400万千瓦，聚合单元报量报价参与现货市场。"}, {"title": "2026年虚拟电厂靠谱厂家推荐：技术落地与成本分析", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260625A03H7500?refer=cp_1009", "summary": "2027年全国虚拟电厂调节能力目标不低于2000万千瓦，厂商分化加剧，工业负荷与碳能耦合成核心壁垒。"}]}, {"label": "企业与市场动态", "color": "#f43f5e", "items": [{"title": "售电公司\"注销潮\"来袭，电力市场变天", "source": "网易", "url": "https://dy.163.com/article/L2EHHM7N05568W0A.html", "summary": "截至2025年底全国注册售电公司5288家，监管收紧推动低效主体出清，行业从\"价差套利\"转向\"服务增值\"。"}, {"title": "北京电力交易中心发布2026年上半年电力市场交易信息", "source": "国家电网", "url": "http://www.sgcc.com.cn/html/sgcc_main/gb/xwzx/zhxw/20260722/352386202607221152000001.shtml", "summary": "上半年国网经营区市场化交易电量34798亿千瓦时增25.6%，云霄直流完成全国首笔输电权试点交易。"}, {"title": "全国首笔输电权市场化交易落地", "source": "经济日报", "url": "https://new.qq.com/rain/a/20260722A03FN700?refer=cp_1009", "summary": "广州与北京交易中心依托云霄直流组织安徽送广东交易，预成交2116万千瓦时、绿电占比超75%。"}, {"title": "江苏监管办创新推动分布式新能源聚合交易", "source": "新浪财经", "url": "https://finance.sina.com.cn/jjxw/2026-07-23/doc-iniiusma7764708.shtml", "summary": "江苏20家虚拟电厂累计成交超1亿千瓦时、聚合规模353万千瓦，试点小时级绿电按小时结算环境价值。"}]}], "flashes": []};
window.DASHBOARD_CONFIG={
  defaultDate:'2026-07-27',
  isPower:true,
  embedded:EMB,
  fetchDaily: async function(dateStr){
    if(dateStr==='2026-07-27') return EMB;
    try{ const r=await fetch('data/power-'+dateStr+'.json',{headers:{'Accept':'application/json'}}); if(!r.ok) return null; return await r.json(); }catch(e){ return null; }
  }
};</script>
<script>
(function(){
  const CFG = window.DASHBOARD_CONFIG || {};
  const embedded = CFG.embedded;
  const defaultDate = CFG.defaultDate || (embedded && embedded.date);
  const isPower = !!CFG.isPower;
  const $ = id => document.getElementById(id);
  function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function fmtDateCN(ds){if(!ds)return '';const dt=new Date(ds+'T00:00:00Z');const wk=['周日','周一','周二','周三','周四','周五','周六'][dt.getUTCDay()];const p=n=>ds.split('-')[n];return (+p(0))+' 年 '+(+p(1))+' 月 '+(+p(2))+' 日 · '+wk;}
  function fmtBeijing(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';const u=d.getTime()+d.getTimezoneOffset()*60000;const b=new Date(u+8*3600000);const wk=['周日','周一','周二','周三','周四','周五','周六'][b.getDay()];const p=n=>(''+n).padStart(2,'0');return b.getFullYear()+'年'+(b.getMonth()+1)+'月'+b.getDate()+'日 '+wk+' '+p(b.getHours())+':'+p(b.getMinutes());}
  function trunc(s,n){s=s||'';const a=Array.from(s);return a.length<=n?s:a.slice(0,n).join('')+'…';}
  function prevDay(s){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10);}
  function totalOf(data){return (data.sections||[]).reduce((a,s)=>a+((s.items&&s.items.length)||0),0);}

  function render(data){
    $('title').textContent = data.title || '日报';
    $('kicker').textContent = data.kicker || '';
    $('dateLine').textContent = fmtDateCN(data.date);
    $('genLine').textContent = data.generatedAt ? ('每日北京时间 08:00 生成 · 本期生成于 '+fmtBeijing(data.generatedAt)) : ('检索于 '+fmtDateCN(data.date)+(isPower?'（联网聚合）':''));
    const statsEl=$('stats'); statsEl.innerHTML='';
    const t=document.createElement('div'); t.className='stat total';
    t.innerHTML='<div class="n">'+totalOf(data)+'</div><div class="l">总条数</div>';
    statsEl.appendChild(t);
    (data.sections||[]).forEach(s=>{
      const el=document.createElement('div'); el.className='stat';
      el.style.background='color-mix(in srgb,'+s.color+' 16%,#fff)';
      el.style.borderColor='color-mix(in srgb,'+s.color+' 30%,#fff)';
      el.innerHTML='<div class="n" style="color:'+s.color+'">'+s.items.length+'</div><div class="l">'+esc(s.label)+'</div>';
      statsEl.appendChild(el);
    });
    const navEl=$('nav'); navEl.innerHTML='';
    (data.sections||[]).forEach((s,i)=>{
      const a=document.createElement('a'); a.href='#sec-'+i;
      a.innerHTML='<span class="dot" style="background:'+s.color+'"></span>'+esc(s.label)+'<span class="c">'+s.items.length+'</span>';
      navEl.appendChild(a);
    });
    const main=$('main'); main.innerHTML='';
    let g=0;
    (data.sections||[]).forEach((s,i)=>{
      const sec=document.createElement('section'); sec.className='section'; sec.id='sec-'+i;
      const h=document.createElement('div'); h.className='sec-head';
      h.innerHTML='<div class="sec-bar" style="background:'+s.color+'"></div><h2>'+esc(s.label)+'</h2><span class="cnt">'+s.items.length+' 条</span>';
      sec.appendChild(h);
      const grid=document.createElement('div'); grid.className='grid';
      (s.items||[]).forEach(it=>{
        g++;
        const c=document.createElement('article'); c.className='card';
        c.style.setProperty('--accent',s.color);
        c.innerHTML='<div class="card-top"><div class="num">'+g+'</div><span class="chip">'+esc(it.source)+'</span></div>'+
          '<h3><a href="'+esc(it.url)+'" target="_blank" rel="noopener noreferrer">'+esc(it.title)+'</a></h3>'+
          '<p class="sum">'+esc(trunc(it.summary,60))+'</p>'+
          '<a class="read" href="'+esc(it.url)+'" target="_blank" rel="noopener noreferrer">阅读原文 →</a>';
        grid.appendChild(c);
      });
      sec.appendChild(grid); main.appendChild(sec);
    });
    if(data.flashes && data.flashes.length){
      const sec=document.createElement('section'); sec.className='section'; sec.id='flashes';
      const h=document.createElement('div'); h.className='sec-head';
      h.innerHTML='<div class="sec-bar" style="background:#ef4444"></div><h2>快讯</h2><span class="cnt">'+data.flashes.length+' 条</span>';
      sec.appendChild(h);
      const grid=document.createElement('div'); grid.className='flash-grid';
      data.flashes.forEach(fl=>{
        const el=document.createElement('div'); el.className='flash';
        el.innerHTML='<div class="ft"><a href="'+esc(fl.url||'#')+'" target="_blank" rel="noopener noreferrer">'+esc(fl.title||'')+'</a></div><div>'+esc(fl.source||'')+'</div>'+(fl.publishedAt?'<div class="fm">'+fmtBeijing(fl.publishedAt)+'</div>':'');
        grid.appendChild(el);
      });
      sec.appendChild(grid); main.appendChild(sec);
      const fa=document.createElement('a'); fa.href='#flashes';
      fa.innerHTML='<span class="dot" style="background:#ef4444"></span>快讯<span class="c">'+data.flashes.length+'</span>';
      navEl.appendChild(fa);
    }
    $('footCount').textContent='本期共 '+totalOf(data)+' 条动态';
    $('footSrc').innerHTML='数据源：<strong>'+esc(data.source||'')+'</strong>'+(data.canonical?'（<a href="'+esc(data.canonical)+'" target="_blank" rel="noopener noreferrer">原文归档</a>）':'');
    $('footNote').textContent=data.note||'';
  }
  function status(msg){const el=$('status'); if(el) el.textContent=msg;}
  function showData(data,loadedDate,requestedEnd){
    render(data);
    let msg='已加载 '+loadedDate+' 的日报（共 '+totalOf(data)+' 条）';
    if(requestedEnd && requestedEnd!==loadedDate) msg+=' · 结束日期 '+requestedEnd+' 暂无数据，已回退至 '+loadedDate;
    status(msg);
  }
  function showEmpty(dateStr){
    $('main').innerHTML='<div class="empty" style="grid-column:1/-1">所选日期（'+dateStr+'）暂无可用日报数据。'+(isPower?'电力交易日报为联网搜索聚合快照，需生成对应日期的快照文件（data/power-'+dateStr+'.json）后方可加载。':'')+'</div>';
    $('stats').innerHTML=''; $('nav').innerHTML='';
    $('title').textContent=(embedded&&embedded.title)||'日报';
    $('kicker').textContent=(embedded&&embedded.kicker)||'';
    $('dateLine').textContent=fmtDateCN(dateStr); $('genLine').textContent='';
    $('footCount').textContent=''; $('footSrc').textContent=''; $('footNote').textContent='';
    status('未找到 '+dateStr+' 的日报');
  }
  function wire(){
    const startInp=$('startDate'), endInp=$('endDate'), btn=$('refreshBtn');
    if(!startInp||!endInp||!btn) return;
    const today=defaultDate;
    startInp.max=endInp.max=today;
    startInp.value=endInp.value=today;
    btn.addEventListener('click', async ()=>{
      let s=startInp.value, e=endInp.value;
      if(!s||!e){ status('请选择起始日期和结束日期'); return; }
      if(e<s){ const tmp=s; s=e; e=tmp; startInp.value=s; endInp.value=e; }
      status('正在加载…');
      let found=false, data=null, date=null;
      for(let d=e; d>=s; d=prevDay(d)){
        const dd = await CFG.fetchDaily(d);
        if(dd){ found=true; data=dd; date=d; break; }
        if(d===s) break;
      }
      if(found) showData(data, date, e);
      else showEmpty(e);
    });
  }
  function init(){
    wire();
    if(embedded) showData(embedded, defaultDate, defaultDate);
    if(CFG.fetchDaily){
      CFG.fetchDaily(defaultDate).then(live=>{ if(live) showData(live, defaultDate, defaultDate); }).catch(()=>{});
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
